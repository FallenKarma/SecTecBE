spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/sectec}
    username: ${DB_USERNAME:sectec}
    password: ${DB_PASSWORD:sectec-local}

server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      cookie:
        secure: false

app:
  account:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    mail-from: ${MAIL_FROM:noreply@sectec.invalid}
    verification-ttl: PT24H
    reset-ttl: PT30M
  cors:
    allowed-origins: "http://127.0.0.1:5174"
